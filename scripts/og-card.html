<!doctype html>
<!-- Source for public/og-card.png (the link-preview card). Render at 1200x630:
     msedge --headless --screenshot=public/og-card.png --window-size=1200,630 --hide-scrollbars file:///.../scripts/og-card.html -->
<html><head><meta charset="utf-8"><style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #fbfbfd; color: #1d1d1f;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased; position: relative;
  }
  .glow { position: absolute; right: -180px; top: -200px; width: 760px; height: 760px; border-radius: 50%;
    background: radial-gradient(circle, rgba(125,60,240,.16), rgba(0,113,227,.10) 45%, transparent 70%); }
  .bar { position: absolute; left: 0; top: 0; width: 100%; height: 10px;
    background: linear-gradient(90deg, #0071e3 0%, #7d3cf0 55%, #e64980 100%); }
  .left { position: absolute; left: 90px; top: 0; bottom: 0; width: 650px; display: flex; flex-direction: column; justify-content: center; }
  .name { font-size: 76px; font-weight: 700; letter-spacing: -2px; line-height: 1.02; }
  .rule { width: 84px; height: 6px; border-radius: 3px; margin: 30px 0 28px;
    background: linear-gradient(90deg, #0071e3, #7d3cf0, #e64980); }
  .tag { font-size: 46px; font-weight: 600; letter-spacing: -.5px;
    background: linear-gradient(90deg, #0071e3 0%, #7d3cf0 60%, #e64980 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .cap { font-size: 30px; color: #6e6e73; margin-top: 16px; }
  .url { position: absolute; left: 90px; bottom: 52px; font-size: 28px; font-weight: 600; color: #0071e3;
    display: flex; align-items: center; gap: 12px; }
  .url svg { width: 30px; height: 30px; }
  .photo { position: absolute; right: 100px; top: 135px; width: 360px; height: 360px; border-radius: 50%;
    background: url("../public/updated formal picture.png") -30px 6px / 380px auto no-repeat; background-color: #fff;
    border: 6px solid #fff; outline: 1px solid rgba(0,0,0,.06); box-shadow: 0 2px 4px rgba(0,0,0,.05), 0 20px 50px rgba(0,0,0,.14); }
</style></head><body>
  <div class="glow"></div><div class="bar"></div>
  <div class="left">
    <div class="name">Bernardino<br>Lintang</div>
    <div class="rule"></div>
    <div class="tag">AI · Product · Data</div>
    <div class="cap">My portfolio and projects</div>
  </div>
  <div class="url">
    <svg viewBox="0 0 24 24" fill="none" stroke="#0071e3" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/></svg>
    bernardinolintang.com
  </div>
  <div class="photo"></div>
</body></html>
